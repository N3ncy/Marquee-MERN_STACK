<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width:25vw;
            border: 1px solid rgb(225, 220, 220);
            height: 60vh;
            border-radius: 20px;
            box-shadow: 2px 2px 2px grey;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center; 
            padding-top: 20px;
            background: #e1dada;
        }
        .icon1{
            display: flex;
            justify-content: space-between;
        }
        
        .img.container{
           
            display: flex;
            align-items: center;
            justify-content: center;   
        }
        .img-container img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            border: 10px solid #eee;
            object-fit: cover;
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
            margin-top: 10px;
        }
        h4{
            margin: 10px 0 5px;
        }
        h3{
            margin: 0 0 15px;
        }
        #socials{
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
        }
        .facebook{
            border-radius: 50%;
            border: 5px solid rgb(243, 239, 239);
            height: 21px;
            width: 20px;
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
            
        }
        .twitter{
            border-radius: 50%;
            border: 5px solid rgb(243, 239, 239);
            height: 21px;
            width: 20px;
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
        }
        .instagram{
            border-radius: 50%;
            border: 5px solid rgb(243, 239, 239);
            height: 21px;
            width: 20px;
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
        }
        .youtube{
            border-radius: 50%;
            border: 5px solid rgb(243, 239, 239);
            height: 20px;
            width: 21px;
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
        }
        #Follower{
            display: flex;
            justify-content: center;
            gap: 55px;
            margin-bottom: 15px;
            width: 20vw;
            
        }
        .msg{
            border: 1px solid rgb(243, 239, 239);
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
            width: 7vw;
            height: 3vh;
            text-align: center;
            border-radius: 20%;
            
        }
        .subs{
            border: 1px solid rgb(243, 239, 239);
            box-shadow: -3px -3px 5px white;
            box-shadow: 3px 3px 5px gray;
            width: 7vw;
            height: 3vh;
            text-align: center;
            border-radius: 20%;
            
        }
        #popular{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 8px;
            width:20vw;
        }
        .like{
            border: 1px solid rgb(243, 239, 239);
            box-shadow: -3px -3px 1px white;
            box-shadow: 3px 3px 1px gray;
            width:5vw;
            border-radius: 20%;
            
        }
        .comment{
            border: 1px solid rgb(243, 239, 239);
            box-shadow: -3px -3px 1px white;
            box-shadow: 3px 3px 1px gray;
            width:5vw;
            border-radius: 20%;
        }
        .share{
            border: 1px solid rgb(243, 239, 239);
            box-shadow: -3px -3px 1px white;
            box-shadow: 3px 3px 1px gray;
            width:5vw;
            border-radius: 20%;
        }
        
    </style>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      /><link>
</head>
<body>
    <article id="container">
        <section id="icons">
        <div class="icon1">
            <i class="fa-duotone fa-solid fa-circle-ellipsis-vertical"></i>
        </div>
        <div class="icon2">
            <i class="fa-duotone fa-light fa-arrow-left-from-line"></i>
        </div>
        </section>

        <div class="img-container">
            <img src="https://tse2.mm.bing.net/th/id/OIP.K9q-gO3H3db3FXPVdJ55UQHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="image">
        </div>
        <h4>Coding_World</h4>
    <h3>Designer & Developer</h3>
    <section id="socials">
        <div class="facebook">
            <i class="fa-brands fa-facebook-f" ></i>
        </div>

        <div class="twitter">
            <i class="fa-brands fa-twitter"></i>
        </div>

        <div class="instagram">
            <i class="fa-brands fa-instagram"></i>
        </div>

        <div class="youtube">
            <i class="fa-brands fa-youtube"></i>
        </div>
    </section>
    
    <section id="Follower">
        <div class="msg">Message</div>
        <div class="subs">Subscribe</div>
    </section>
    <section id="popular">
        <div class="like">❤️ 20.14k</div>
        <div class="comment">💬 10.4k</div>
        <div class="share">↗️12.5k</div>
    </section>
    
    </article>
</body>
</html>
