<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            outline: none;
            border: none;
            border-bottom: solid 2px;
        }
    </style>
</head>
<body>
    <h1><strong>Job Application Form</strong></h1>
    <form action="actionPage.html" method="get">

        <fieldset>
            <legend>PERSONAL INFORMATION</legend>
            <ul>
                <li>
                <label for="fname">Name: </label>
                <input type="text"
                name="fname"
                id="fname"
                required>
                </li>
                <li>
                    <label for="addr">Address: </label>
                    <input type="text"
                    name="addr"
                    id="addr"
                    required>
                </li>
                <li>
                    <label for="dob">DOB: </label>
                    <input type="date"
                    name="dob"
                    id="dob"
                    required>
                </li>
                <li>
                    <label for="city">City/State: </label>
                    <input type="text"
                    name="city"
                    id="city"
                    required>
                </li>
                <li>
                    <label for="mail">Email Address: </label>
                    <input type="email"
                    name="mail"
                    id="mail"
                    required>
                </li>
                <li>
                    <label for="contact">Phone Number: </label>
                    <input type="number"
                    name="contact"
                    id="contact"
                    required>
                </li>
                <li>
                    <label for="pos">Position applied for: </label>
                    <input type="text"
                    name="pos"
                    id="pos"
                    required>
                </li>
                <li>
                    <label for="data">Data available: </label>
                    <input type="text"
                    name="data"
                    id="data"
                    required>
                </li>
                <li>
                    Desired pay:
                    <label for="pay-hour">Hour</label>
                    <input type="checkbox"
                    name="pay"
                    id="pay"
                    value="pay-hour"
                    required>
                </li>
                <li>
                    
                    <label for="data"></label>
                    <input type="text"
                    name="data"
                    id="data"
                    required>
                </li>
                
            </ul>
        </fieldset>

        <fieldset>
            <legend>EMPLOYMENT ELIGIBILITY</legend>
        </fieldset>

        <fieldset>
            <legend>EDUCATION</legend>
        </fieldset>

    </form>

</body>
</html>
